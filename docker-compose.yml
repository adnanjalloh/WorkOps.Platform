services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: workops
      POSTGRES_USER: workops
      POSTGRES_PASSWORD: ${WORKOPS_DB_PASSWORD:-local-development-only}
    ports:
      - "${WORKOPS_DB_PORT:-5432}:5432"
    volumes:
      - workops-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workops -d workops"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  identity:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${WORKOPS_IDENTITY_ADMIN:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${WORKOPS_IDENTITY_ADMIN_PASSWORD:-local-development-only}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${WORKOPS_IDENTITY_PORT:-8081}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${WORKOPS_IDENTITY_PORT:-8081}:8080"
    volumes:
      - ./infra/keycloak/workops-realm.json:/opt/keycloak/data/import/workops-realm.json:ro
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:4.3.4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: workops
      RABBITMQ_DEFAULT_PASS: ${WORKOPS_RABBITMQ_PASSWORD:-local-development-only}
    ports:
      - "${WORKOPS_RABBITMQ_PORT:-5672}:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.8.1-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${WORKOPS_REDIS_PASSWORD:-local-development-only}
    ports:
      - "${WORKOPS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    image: workops-platform:${WORKOPS_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      Authentication__Audience: workops-api
      Authentication__Issuer: http://localhost:${WORKOPS_IDENTITY_PORT:-8081}/realms/workops
      Authentication__MetadataAddress: http://identity:8080/realms/workops/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
      ConnectionStrings__WorkOps: Host=postgres;Port=5432;Database=workops;Username=workops;Password=${WORKOPS_DB_PASSWORD:-local-development-only};Include Error Detail=false
      ConnectionStrings__Redis: redis:6379,password=${WORKOPS_REDIS_PASSWORD:-local-development-only},abortConnect=false
      Cache__Enabled: "true"
      Files__DevelopmentScannerEnabled: "true"
      Files__RootPath: /tmp/workops-attachments
      Messaging__Enabled: "true"
      Messaging__HostName: rabbitmq
      Messaging__Port: 5672
      Messaging__VirtualHost: /
      Messaging__UserName: workops
      Messaging__Password: ${WORKOPS_RABBITMQ_PASSWORD:-local-development-only}
      Operations__ApplyMigrations: "true"
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${WORKOPS_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  workops-postgres:
