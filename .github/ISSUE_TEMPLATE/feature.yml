name: Feature request
description: Propose a focused, evidence-backed improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, and operational considerations
      description: Note input, authorization, workspace isolation, data, and delivery effects.
    validations:
      required: true
