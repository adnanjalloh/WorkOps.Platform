name: Bug report
description: Report a reproducible defect that is not a security vulnerability.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities or include credentials/private data here. Follow SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the defect using synthetic or redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal, safe steps and the affected commit/version.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Additional context
      description: Include sanitized logs or environment details when relevant.
