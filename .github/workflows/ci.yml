name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Restore local tools
        run: dotnet tool restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test --configuration Release --no-build --maxcpucount:1 --logger "trx"
          --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[WorkOps.*Tests]*"

      - name: Merge coverage
        run: >-
          dotnet tool run reportgenerator --
          "-reports:artifacts/test-results/**/coverage.cobertura.xml"
          "-targetdir:artifacts/coverage"
          "-assemblyfilters:+WorkOps.*;-WorkOps.*Tests;-* *"
          "-classfilters:-Microsoft.AspNetCore.OpenApi.Generated.*;-System.Runtime.CompilerServices.*"
          "-reporttypes:Cobertura;HtmlInline;MarkdownSummaryGithub;TextSummary"

      - name: Enforce coverage
        run: scripts/check-coverage.sh artifacts/coverage/Cobertura.xml 70 35

      - name: Add coverage summary
        run: cat artifacts/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report NuGet vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

      - name: Validate local Compose boundary
        run: scripts/check-compose-security.sh

      - name: Validate Bash reviewer bootstrap
        run: ./scripts/bootstrap.sh

      - name: Validate PowerShell reviewer bootstrap
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container
        run: docker build --tag workops-platform:ci .

      - name: Scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: workops-platform:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          timeout: 10m0s

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-evidence
          path: |
            artifacts/test-results
            artifacts/coverage
          if-no-files-found: error
          retention-days: 14
