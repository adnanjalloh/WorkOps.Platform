name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      actions: read
      contents: write
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "The tagged commit is not on master." >&2
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx" --results-directory artifacts/test-results

      - name: Audit NuGet dependencies
        run: dotnet list package --vulnerable --include-transitive

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image tags
        id: image
        shell: bash
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "version=ghcr.io/${repository}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=ghcr.io/${repository}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build release container
        run: >-
          docker build
          --build-arg VCS_REF="$GITHUB_SHA"
          --build-arg VERSION="${GITHUB_REF_NAME#v}"
          --tag "${{ steps.image.outputs.version }}"
          --tag "${{ steps.image.outputs.commit }}"
          .

      - name: Scan release container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: ${{ steps.image.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          timeout: 10m0s

      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.version }}
          format: spdx-json
          output-file: artifacts/workops-platform-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign in to container registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish immutable images
        run: |
          docker push "${{ steps.image.outputs.version }}"
          docker push "${{ steps.image.outputs.commit }}"

      - name: Record image evidence
        shell: bash
        run: |
          mkdir -p artifacts
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.image.outputs.version }}")
          printf 'Version tag: %s\nCommit tag: %s\nDigest: %s\n' \
            "${{ steps.image.outputs.version }}" \
            "${{ steps.image.outputs.commit }}" \
            "$digest" > artifacts/container-image.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/workops-platform-${{ github.ref_name }}.spdx.json
            artifacts/container-image.txt
