name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/master)" ]]; then
            echo "The tagged commit must be the current master head." >&2
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Restore local tools
        run: dotnet tool restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test --configuration Release --no-build --maxcpucount:1 --logger "trx"
          --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[WorkOps.*Tests]*"

      - name: Merge coverage
        run: >-
          dotnet tool run reportgenerator --
          "-reports:artifacts/test-results/**/coverage.cobertura.xml"
          "-targetdir:artifacts/coverage"
          "-assemblyfilters:+WorkOps.*;-WorkOps.*Tests;-* *"
          "-classfilters:-Microsoft.AspNetCore.OpenApi.Generated.*;-System.Runtime.CompilerServices.*"
          "-reporttypes:Cobertura;MarkdownSummaryGithub;TextSummary"

      - name: Enforce coverage
        run: scripts/check-coverage.sh artifacts/coverage/Cobertura.xml 70 35

      - name: Report NuGet vulnerabilities
        run: dotnet list package --vulnerable --include-transitive

      - name: Validate local Compose boundary
        run: scripts/check-compose-security.sh

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release container
        run: >-
          docker build
          --build-arg VCS_REF="$GITHUB_SHA"
          --build-arg VERSION="${GITHUB_REF_NAME#v}"
          --tag workops-platform:release-candidate
          .

      - name: Scan release container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: workops-platform:release-candidate
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln,secret
          timeout: 10m0s

      - name: Generate container SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: workops-platform:release-candidate
          format: spdx-json
          output-file: artifacts/workops-platform-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Package verified image
        shell: bash
        run: |
          docker save --output artifacts/workops-platform-image.tar workops-platform:release-candidate
          sha256sum artifacts/workops-platform-image.tar > artifacts/workops-platform-image.tar.sha256
          cp "docs/releases/${GITHUB_REF_NAME}.md" artifacts/release-notes.md

      - name: Upload verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            artifacts/workops-platform-image.tar
            artifacts/workops-platform-image.tar.sha256
            artifacts/workops-platform-${{ github.ref_name }}.spdx.json
            artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish verified release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: artifacts

      - name: Verify and load release candidate
        shell: bash
        run: |
          sha256sum --check artifacts/workops-platform-image.tar.sha256
          docker load --input artifacts/workops-platform-image.tar

      - name: Define image tags
        id: image
        shell: bash
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "version=ghcr.io/${repository}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=ghcr.io/${repository}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Sign in to container registry
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish version and commit tags
        shell: bash
        run: |
          docker tag workops-platform:release-candidate "${{ steps.image.outputs.version }}"
          docker tag workops-platform:release-candidate "${{ steps.image.outputs.commit }}"
          docker push "${{ steps.image.outputs.version }}"
          docker push "${{ steps.image.outputs.commit }}"

      - name: Resolve immutable registry digest
        id: digest
        shell: bash
        env:
          VERSION_IMAGE: ${{ steps.image.outputs.version }}
          COMMIT_IMAGE: ${{ steps.image.outputs.commit }}
        run: |
          version_manifest=$(docker buildx imagetools inspect "$VERSION_IMAGE" --format '{{json .Manifest}}')
          commit_manifest=$(docker buildx imagetools inspect "$COMMIT_IMAGE" --format '{{json .Manifest}}')
          version_digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$version_manifest")
          commit_digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$commit_manifest")

          if [[ "$version_digest" != "$commit_digest" ]]; then
            echo "Version and commit tags resolved to different registry digests." >&2
            exit 1
          fi

          echo "digest=$version_digest" >> "$GITHUB_OUTPUT"

      - name: Record image evidence
        shell: bash
        run: |
          printf 'Version tag: %s\nCommit tag: %s\nDigest: %s\n' \
            "${{ steps.image.outputs.version }}" \
            "${{ steps.image.outputs.commit }}" \
            "${{ steps.digest.outputs.digest }}" > artifacts/container-image.txt

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: artifacts/workops-platform-${{ github.ref_name }}.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: artifacts/release-notes.md
          make_latest: true
          files: |
            artifacts/workops-platform-${{ github.ref_name }}.spdx.json
            artifacts/container-image.txt
